        - name: "input"
          in: "query"
          required: true
          description: "The procedure input, JSON-encoded (tRPC 11, non-batched)."
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: false
                properties:
                  kind:
                    type: "string"
                    enum:
                      - "failed"
                      - "stuck"
                  cursor:
                    anyOf:
                      - type: "string"
                      - type: "null"
                required:
                  - "kind"
                  - "cursor"
  "/api/jobs/trm-fetch":
    post:
      operationId: "job_trm_fetch"
      summary: "S-FR-CAT-8.fetch fetchTrm (contracts.md §3)"
      description: "Scheduled entry point (ARCHITECTURE §4). Idempotent and single-flight under `job:<name>` (AD-SYS-4 rule 7); writes one JobRun row."
      tags:
        - "jobs"
      security:
        - jobsSecret: []
      responses:
        "200":
          description: "The run finished, or was skipped because another run holds the lock."
        "401":
          description: "Missing or wrong JOBS_SECRET bearer; no JobRun row is written (S-9)."
  "/api/jobs/expiry-materialize":
