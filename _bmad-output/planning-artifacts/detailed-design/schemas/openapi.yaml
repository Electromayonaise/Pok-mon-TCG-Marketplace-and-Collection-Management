  "/api/health/live":
    get:
      operationId: "health_liveness"
      summary: "Liveness: the process serves requests."
      tags:
        - "health"
      responses:
        "200":
          description: "Alive."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "status"
                properties:
                  status:
                    const: "ok"
  "/api/health/ready":
    get:
      operationId: "health_readiness"
      summary: "Readiness: the database answers and every migration is applied unedited."
      tags:
        - "health"
      responses:
        "200":
          description: "Ready."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "ready"
                  - "checks"
                  - "pending"
                properties:
                  ready:
                    type: "boolean"
                  checks:
                    type: "object"
                    required:
                      - "database"
                      - "migrations"
                    properties:
                      database:
                        type: "string"
                        enum:
                          - "ok"
                          - "unreachable"
                      migrations:
                        type: "string"
                        enum:
                          - "current"
                          - "pending"
                          - "edited"
                          - "unknown"
                          - "not-checked"
                  pending:
                    type: "array"
                    items:
                      type: "string"
                    description: "Migration files not yet applied."
        "503":
          description: "Not ready: the database is unreachable or a migration is pending, edited or unknown."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "ready"
                  - "checks"
                  - "pending"
                properties:
                  ready:
                    type: "boolean"
                  checks:
                    type: "object"
                    required:
                      - "database"
                      - "migrations"
                    properties:
                      database:
                        type: "string"
                        enum:
                          - "ok"
                          - "unreachable"
                      migrations:
                        type: "string"
                        enum:
                          - "current"
                          - "pending"
                          - "edited"
                          - "unknown"
                          - "not-checked"
                  pending:
                    type: "array"
                    items:
                      type: "string"
                    description: "Migration files not yet applied."
