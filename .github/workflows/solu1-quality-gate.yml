# Solu-1 quality gate (bmad-testarch-ci). It proves, when run:
#   1. the stubs and DTOs typecheck;
#   2. the migrations physically enforce the invariants (GREEN schema suite);
#   3. every ATDD test is RED for the right reason — it fails on NotImplementedError, never
#      passes and never fails on a broken Given step (scripts/check-atdd-red.mjs);
#   4. every error-code citation in contracts.md matches the registry (AD-SYS-1).
# Sharding: one shard (the whole suite runs in about 5 s). Burn-in: the GREEN suite is
# repeated 10 times, because a flaky constraint proof would make the gate a rubber stamp.
name: solu1-quality-gate

# Manual evidence only since Impl-1 (decision log #9); impl1-quality-gate runs on push and PR.
on:
  workflow_dispatch:

concurrency:
  group: solu1-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: tezg
          POSTGRES_PASSWORD: tezg
          POSTGRES_DB: tezg
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U tezg -d tezg"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      TEZG_PG_HOST: 127.0.0.1
      TEZG_PG_PORT: '55432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck (stubs, DTOs, tests)
        run: npm run typecheck
      - name: GREEN — physical invariants (JUnit report)
        run: npx vitest run --project solu1-schema --reporter=default --reporter=junit --outputFile.junit=.vitest-results/solu1-schema.junit.xml
      - name: RED — ATDD fails for the right reason (≥ 131 tests)
        run: npm run gate:atdd-red:solu1
      - name: Error-code citations match the registry
        run: npm run gate:codes:solu1
      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solu1-vitest-results
          path: .vitest-results/
          retention-days: 14

  burn-in:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: tezg
          POSTGRES_PASSWORD: tezg
          POSTGRES_DB: tezg
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U tezg -d tezg"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      TEZG_PG_HOST: 127.0.0.1
      TEZG_PG_PORT: '55432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: GREEN suite × 10
        run: for i in $(seq 1 10); do npm run test:schema:solu1 || exit 1; done
