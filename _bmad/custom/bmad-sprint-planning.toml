# Team override for bmad-sprint-planning (committed; never touched by the installer).
#
# The installed skill only parses epics and writes sprint-status.yaml; it has no readiness
# audit. The Solu packages require it to certify readiness first (decision log, Solu-1 #18):
# this prepend runs the deterministic audit and HALTs on IR-FAIL, so a sprint status file can
# only be generated for a backlog that passes.

[workflow]

activation_steps_prepend = [
  "The backlog is the Solu-2 package, docs/solu-2 (the Solu-1 package was retired, git 853449c). Run `node {project-root}/scripts/readiness-audit.mjs --package docs/solu-2 --json {project-root}/.vitest-results/readiness-solu-2.json` from the project root and show its full output verbatim. If it exits non-zero (IR-FAIL), HALT: do not create or update sprint-status.yaml; list each finding and name the skill that fixes it (bmad-architecture for contracts and schemas, bmad-create-epics-and-stories for stories, bmad-correct-course for scope). Only on exit 0 (IR-PASS) continue with the workflow.",
]

persistent_facts = [
  "Epics are read from _bmad-output/planning-artifacts/epics.md, and the only status file is _bmad-output/implementation-artifacts/sprint-status.yaml.",
  "For Impl-1, the backlog is Solu-2's: the readiness audit runs on docs/solu-2, epics are read from _bmad-output/planning-artifacts/epics.md, and the status file is _bmad-output/implementation-artifacts/sprint-status.yaml. Its impl2_scope list (853449c:docs/impl-1/task-statement.md Appendix B.2) is carried over unchanged, and those stories stay backlog.",
]
