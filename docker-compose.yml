# Local stack (Impl-1 statement §4.2): `docker compose up` builds the service, migrates its
# database and serves http://localhost:3000, with both health probes green. The tests start only
# Postgres (`npm run db:up`) and give every test file its own database. Postgres runs on tmpfs:
# its data is throwaway, and a restart begins from an empty server. Never a deployed environment.
name: tezg

services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_USER: tezg
      POSTGRES_PASSWORD: tezg
      POSTGRES_DB: tezg
    ports:
      - "55432:5432"
    # max_connections covers the 50-connection concurrency proofs (NFR-SYS-10, AD-SYS-5 rule 4).
    command: ["postgres", "-c", "max_connections=200", "-c", "fsync=off", "-c", "full_page_writes=off"]
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tezg -d tezg"]
      interval: 2s
      timeout: 2s
      retries: 30

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    # The variables src/shared-kernel/config.ts validates (.env.example documents each one).
    environment:
      DATABASE_URL: postgresql://tezg:tezg@postgres:5432/tezg_dev
      BETTER_AUTH_SECRET: local-compose-secret-not-for-any-deployed-environment
      BETTER_AUTH_URL: http://localhost:3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
